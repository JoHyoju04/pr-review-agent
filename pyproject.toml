[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-review-agent"
version = "0.1.0"
description = "병렬 탐지 + 검증자 투표 방식의 Pull Request 리뷰 에이전트"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# review.yaml 파싱은 내장 미니 파서로도 동작한다. PyYAML이 있으면 그것을 사용한다.
yaml = ["PyYAML>=6"]
dev = ["pytest>=7"]

[project.scripts]
review = "review_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
